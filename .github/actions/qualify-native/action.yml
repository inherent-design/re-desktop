name: Qualify a native target
description: Test and package the current OS using the shared compiled Bend core.
inputs:
  module:
    description: Compressed Bend module from the proof job
    required: true
  provenance:
    description: Bend provenance from the proof job
    required: true
runs:
  using: composite
  steps:
    - run: npm ci
      shell: bash
    - run: node scripts/ci-core.mjs import
      shell: bash
      env:
        BEND_MODULE: ${{ inputs.module }}
        BEND_PROVENANCE: ${{ inputs.provenance }}
    - run: npm run check:build
      shell: bash
    - run: npm test
      shell: bash
    - name: Prepare the Linux test desktop and Chromium sandbox
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes xvfb libgtk-3-0t64 libnss3 libasound2t64
        node -p "require('electron')"
        sudo chown root:root node_modules/electron/dist/chrome-sandbox
        sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
    - if: runner.os == 'Linux'
      run: xvfb-run -a npm run test:tray
      shell: bash
    - if: runner.os != 'Linux'
      run: npm run test:tray
      shell: bash
    - run: npm run package
      shell: bash
    - run: node scripts/packaged-check.mjs --headless
      shell: bash
    - run: node scripts/archive.mjs
      shell: bash
    - run: node scripts/archive-check.mjs
      shell: bash
