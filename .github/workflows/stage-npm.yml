name: Stage a published preview on npm
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version of the published GitHub preview
        required: true
        type: string
permissions:
  contents: read
jobs:
  stage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify the tarball attached to the published preview
        id: preview
        run: node scripts/release.mjs prepare-npm-stage
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
      - name: Stage the verified npm tarball for maintainer approval
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PREVIEW_TARBALL: ${{ steps.preview.outputs.tarball }}
        run: |
          if npm whoami >/dev/null 2>&1; then
            echo 'npm recognized the CI credential.'
          else
            echo 'npm could not verify the CI credential identity.'
          fi
          npm stage publish "$PREVIEW_TARBALL" --access public --tag preview --json
