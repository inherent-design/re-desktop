name: Dependency and security review
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '32 7 * * *'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: '2026.11.9'
      - name: Validate Renovate configuration
        run: npx --yes --package renovate@44.255.1 renovate-config-validator --strict renovate.json
      - name: Scan source and locked dependencies
        run: |
          mkdir -p artifacts/security
          trivy fs --scanners vuln,misconfig,secret --format json --output artifacts/security/trivy.json .
      - name: Write redacted reports and enforce the severity gate
        run: node scripts/security-report.mjs
      - name: Publish code-scanning results when public
        if: ${{ always() && !github.event.repository.private && hashFiles('artifacts/security/trivy.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          sarif_file: artifacts/security/trivy.sarif
