name: Build and qualify
on:
  push:
    branches: [main, dev]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml

  bend:
    runs-on: ubuntu-latest
    outputs:
      module: ${{ steps.core.outputs.module }}
      provenance: ${{ steps.core.outputs.provenance }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: sudo apt-get install --yes zstd
      - run: npm run setup:bend
      - run: npm run setup:kernel
      - run: npm run proof:kernel
      - run: npm run check
      - id: core
        run: node scripts/ci-core.mjs export

  node-24:
    needs: bend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/ci-core.mjs import
        env:
          BEND_MODULE: ${{ needs.bend.outputs.module }}
          BEND_PROVENANCE: ${{ needs.bend.outputs.provenance }}
      - run: npm test

  desktop:
    needs: bend
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: node scripts/ci-core.mjs import
        env:
          BEND_MODULE: ${{ needs.bend.outputs.module }}
          BEND_PROVENANCE: ${{ needs.bend.outputs.provenance }}
      - run: npm run check:build
      - run: npm test
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb libgtk-3-0t64 libnss3 libasound2t64
      - name: Configure the Linux Chromium sandbox helper
        if: runner.os == 'Linux'
        run: |
          node -p "require('electron')"
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:tray
      - if: runner.os != 'Linux'
        run: npm run test:tray
      - run: npm run package
      - run: node scripts/packaged-check.mjs --headless
      - run: node scripts/archive.mjs
      - run: node scripts/archive-check.mjs
