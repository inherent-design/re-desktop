name: Build and qualify
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: sudo apt-get install --yes zstd
      - run: npm run setup:bend
      - run: npm run setup:kernel
      - run: npm run proof:kernel
      - run: npm run check
      - uses: actions/upload-artifact@v7
        with:
          name: bend-core
          path: build/
          if-no-files-found: error

  desktop:
    needs: bend
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: bend-core
          path: build/
      - run: npm run check:build
      - run: npm test
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb libgtk-3-0t64 libnss3 libasound2t64
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:tray
      - if: runner.os != 'Linux'
        run: npm run test:tray
      - run: npm run package
      - run: node scripts/packaged-check.mjs --headless
      - run: node scripts/archive.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            artifacts/tray-acceptance.json
          if-no-files-found: error

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release-artifacts
          merge-multiple: true
      - name: Create a draft from a deliberately pushed release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-artifacts/*.tar.gz release-artifacts/*.zip release-artifacts/*.sha256 --verify-tag --draft --generate-notes
