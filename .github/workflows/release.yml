name: Publish preview
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  security:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml
  core:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      module: ${{ steps.core.outputs.module }}
      provenance: ${{ steps.core.outputs.provenance }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm
      - name: Require exact version and previously qualified source
        run: node scripts/release.mjs preflight
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci
      - run: sudo apt-get install --yes zstd
      - run: npm run setup:bend
      - run: npm run setup:kernel
      - run: npm run proof:kernel
      - run: npm run check
      - id: core
        run: node scripts/ci-core.mjs export
  draft:
    needs: [security, core]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.release-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
      - id: draft
        run: node scripts/release.mjs draft
        env:
          GH_TOKEN: ${{ github.token }}
  native:
    needs: [core, draft]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm
      - uses: ./.github/actions/qualify-native
        with:
          module: ${{ needs.core.outputs.module }}
          provenance: ${{ needs.core.outputs.provenance }}
      - name: Upload qualified assets directly to the draft
        run: node scripts/release.mjs upload-native
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft.outputs.release-id }}
  publish:
    needs: [core, draft, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci --prefix bootstrap --ignore-scripts
      - name: Pack the public bootstrap
        working-directory: bootstrap
        run: |
          mkdir -p ../dist
          npm pack --pack-destination ../dist
      - name: Verify complete inventory, upload manifest last, and publish preview
        run: node scripts/release.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft.outputs.release-id }}
          BEND_PROVENANCE: ${{ needs.core.outputs.provenance }}
      - name: Publish npm package
        run: node scripts/release.mjs npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_PUBLIC: ${{ !github.event.repository.private }}
      - name: Wait for public npm availability and verify registry integrity
        run: node scripts/npm-ready.mjs
